name: Varredura de casas em Maricá

on:
  schedule:
    - cron: "13 * * * *" # todo dia, a cada hora, no minuto 13
  workflow_dispatch: {} # botão "Run workflow" no GitHub Actions

permissions:
  contents: write

concurrency:
  group: radar-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Rodar varredura
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python scraper.py

      - name: Salvar resultados novos
        run: |
          git config user.name "radar-casas-marica-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/listings.json
          if git diff --cached --quiet; then
            echo "Nada novo para salvar."
          else
            git commit -m "Atualiza anúncios encontrados ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
